name: Automatically version web changes
on:
  push:
    branches: [main]
    paths: ['calculator.html', 'mobile-settings.js', 'index.html', 'install.html', 'pwa-install.js', 'desktop-download.js', 'manifest.webmanifest', 'sw.js', 'sw-v103.js']
permissions:
  contents: write
concurrency:
  group: web-version-main
  cancel-in-progress: false
jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/auto-version.cjs
      - name: Save version
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add release.json calculator.html SevenTask-Calculator-Last-Final-Design-Preview.html sw.js sw-v103.js scripts/.web-release-state.json
            git commit -m 'Automatically update web release version'
            git push
          fi
